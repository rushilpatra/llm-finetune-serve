# 8-shot chain-of-thought prompting of the pretrained base model.
# This is the baseline every fine-tuned config is compared against.
name: baseline_8shot
model: Qwen/Qwen3-0.6B-Base
split: val
shots: 8
val_size: 750
max_new_tokens: 400
temperature: 0.0
seed: 0
max_model_len: 2048
gpu_memory_utilization: 0.85
